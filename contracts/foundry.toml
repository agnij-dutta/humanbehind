[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# The real-proof test reads a fixture produced by scripts/prove-fixture.ts.
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "../deployments" }]

[fuzz]
runs = 256

[fmt]
# Vendored from @anon-aadhaar/contracts@2.4.3; kept byte-identical to upstream.
ignore = ["src/vendor/*.sol", "src/vendor/interfaces/*.sol"]
