[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# The real-proof test reads a fixture produced by scripts/prove-fixture.ts.
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "../deployments" }]

[fuzz]
runs = 256

[fmt]
# Vendored from @anon-aadhaar/contracts@2.4.3; kept byte-identical to upstream.
ignore = ["src/vendor/*.sol", "src/vendor/interfaces/*.sol"]

[lint]
ignore = ["src/vendor/*.sol", "src/vendor/interfaces/*.sol"]
# Naming lints are off on purpose: public immutables and ERC-721 `name`/`symbol`
# are ABI surface, and renaming them to SCREAMING_SNAKE_CASE would change the
# getters every client calls. `unsafe-cheatcode` flags vm.readFile, which the
# real-proof test needs (scoped by fs_permissions above).
exclude_lints = [
  "screaming-snake-case-immutable",
  "screaming-snake-case-const",
  "mixed-case-variable",
  "unsafe-cheatcode",
  "unwrapped-modifier-logic",
]
